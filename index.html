<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여객 휴항 증명서류 작성</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--pri:#1a1f8f;--red:#c80000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1d2027;--tx:#e8eaef;--mut:#9aa3b2;--bd:#343945;--pri:#8f96ff}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--tx:#e8eaef;--mut:#9aa3b2;--bd:#343945;--pri:#8f96ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans KR','Malgun Gothic',sans-serif}
.wrap{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:560px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:0 0 10px;color:var(--pri)}.mut{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
select,input[type=text],input[type=date],textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx);margin:6px 0}
.modes label{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;color:var(--tx);font-size:13px;cursor:pointer}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700;width:100%}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri);margin-top:8px}button:disabled{opacity:.5}
#st{font-size:12px;margin-top:6px;color:var(--mut)}
.stage{overflow:auto;background:#8a8f9a;border-radius:12px;padding:12px}
.pages{width:794px;margin:auto;zoom:var(--z,1)}
.page{width:794px;height:1123px;background:#fff;color:#111;margin:0 auto 14px;padding:48px 56px;position:relative;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden}
.page h1{text-align:center;font-size:25px;letter-spacing:2px;margin:14px 0 4px}.page .sub{text-align:center;font-size:12px;color:#555;margin-bottom:16px}
.hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1a1f8f;padding-bottom:10px}.hd img{height:64px}
.hd b{font-size:15px;display:block}.hd span{font-size:10.5px;color:#444;display:block}
.sec{margin-top:14px}.sec h3{margin:0 0 5px;font-size:13px;background:#e9ebf2;padding:4px 8px;border-left:4px solid #1a1f8f}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #9aa0ad;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f1f2f6;width:18%;font-weight:500}
table.t th{width:auto;text-align:center}table.t td{text-align:center}
.p{font-size:12.5px;line-height:1.75;margin:4px 0}.chg{color:#c80000;font-weight:700}
.foot{position:absolute;left:56px;right:56px;bottom:120px;text-align:center;font-size:13px}
.seal{height:62px;vertical-align:middle;margin-left:8px}.stamp{display:inline-block;border:1px solid #888;border-radius:50%;width:54px;height:54px;line-height:54px;color:#999;font-size:11px;margin-left:10px;vertical-align:middle}
.att{text-align:center;font-size:13px;font-weight:700;margin-bottom:8px}.page img.fit{display:block;max-width:100%;max-height:990px;margin:0 auto;border:1px solid #ccc}
</style></head><body>
<div class="wrap">
<div>
<div class="panel"><h1>여객 휴항 증명서류 작성</h1><div class="mut">E-Ticket 이미지를 올리면 휴항 사유·여객 변경사항을 담은 확인서를 만들어 PDF로 내려받습니다.</div></div>

<div class="panel"><h2>① E-Ticket 업로드 (PDF 권장)</h2>
<input type="file" id="file" accept="application/pdf,image/*">
<button id="ext" class="sec" disabled>이미지(JPG)에서 AI 자동 입력 · claude.ai 전용</button>
<div id="st">E-Ticket PDF를 올리면 바로 자동 입력됩니다. 입력된 값은 모두 수정 가능합니다.</div></div>

<div class="panel"><h2>② 처리 유형</h2><div class="modes">
<label><input type="radio" name="mode" value="date" checked>날짜 변경</label>
<label><input type="radio" name="mode" value="all"><span id="lbl_all">왕복 전체 취소</span></label>
<label><input type="radio" name="mode" value="ret">복편(리턴)만 취소</label></div>
<div id="dateOpt">
<div class="chk"><input type="checkbox" id="c_out"><span>가는편 날짜 변경</span></div>
<div class="g2"><div><label>변경 전 날짜</label><input type="date" id="out_orig"></div><div><label>변경 후 날짜</label><input type="date" id="out_dep"></div></div>
<label>변경 전 항차 (선택)</label><input type="text" id="out_ovoy">
<div class="chk" style="margin-top:12px"><input type="checkbox" id="c_ret" checked><span>복편 날짜 변경</span></div>
<div class="g2"><div><label>변경 전 날짜</label><input type="date" id="ret_orig" value="2026-10-18"></div><div><label>변경 후 날짜</label><input type="date" id="ret_dep"></div></div>
<label>변경 전 항차 (선택)</label><input type="text" id="ret_ovoy"></div>
<label>환불(예정) 금액 - 취소 시 (KRW)</label><input type="text" id="refund">
<div class="chk"><input type="checkbox" id="nofee" checked><span>천재지변 사유 변경/취소 수수료 미부과 문구 포함</span></div></div>

<div class="panel"><h2>③ 여객·승선권 정보</h2>
<label>여정 구분</label><select id="trip"><option value="rt">왕복 (RT)</option><option value="ow">편도 (OW) - 편도 구간은 '가는편' 칸에 입력</option></select>
<div class="g2"><div><label>영문 성명</label><input type="text" id="name"></div><div><label>티켓번호</label><input type="text" id="tno"></div>
<div><label>발권일</label><input type="date" id="issue"></div><div><label>선명</label><input type="text" id="vessel" value="Oriental Pearl VIII"></div>
<div><label>가는편 항차</label><input type="text" id="out_voy"></div><div><label>복편 항차</label><input type="text" id="ret_voy"></div>
<div><label>가는편 출발→도착</label><input type="text" id="out_rt" value="인천 → 단동"></div><div><label>복편 출발→도착</label><input type="text" id="ret_rt" value="단동 → 인천"></div>
<div><label>가는편 도착일</label><input type="date" id="out_arr"></div><div><label>복편 도착일</label><input type="date" id="ret_arr"></div>
<div><label>좌석등급</label><input type="text" id="cls"></div><div><label>총 운임 (KRW)</label><input type="text" id="total"></div>
<div><label>운임</label><input type="text" id="fare"></div><div><label>유류할증료</label><input type="text" id="fuel"></div>
<div><label>세금</label><input type="text" id="tax"></div></div></div>

<div class="panel"><h2>④ 휴항 내용</h2>
<div class="g2"><div><label>휴항 공문 일자</label><input type="date" id="cdate" value="2026-10-16"></div><div><label>해당 선박</label><input type="text" id="ship" value="OP8호(Oriental Pearl VIII)"></div></div>
<label>휴항 사유</label><textarea id="why">단동 현지 기상악화의 영향으로 단동항(요녕성) 해사국의 항만통제가 시행됨</textarea>
<label>휴항 일정 (줄바꿈으로 구분)</label><textarea id="skip">2026. 10. 16.(금) : 인천입항 & 1항차 휴항
2026. 10. 19.(월) : 인천출항
2026. 10. 20.(화) : 단동입항 & 단동출항 - 정상운항</textarea>
<label>휴항 경위 (내용)</label><textarea id="detail" style="min-height:110px">2026. 10. 16.(금), 단동항의 기상악화에 따른 항만통제로 인해 OP8호(Oriental Pearl VIII)의 인천 출항편이 결항되었음. 이에 따라 2026. 10. 18.(일) 예정된 단동 출항편도 운항이 취소되며, 2026. 10. 19.(월) 인천 출항편부터 정상 운항을 재개할 예정임.</textarea>
<label>발급일</label><input type="date" id="docd">
<div class="chk"><input type="checkbox" id="a2" checked><span>첨부: 변경 E-Ticket 확인증</span></div></div>

<div class="panel"><button id="dl">PDF 다운로드</button><div id="st2" class="mut" style="margin-top:6px"></div></div>
</div>
<div class="stage" id="stage"><div class="pages" id="pages"></div></div>
</div>
